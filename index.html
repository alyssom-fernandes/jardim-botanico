<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Jardim Botânico · Mapa</title>
<meta name="description" content="Mapa do Jardim Botânico do Rio de Janeiro com GPS, bússola e os 63 pontos da placa oficial.">
<meta name="theme-color" content="#1f5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jardim">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="map" aria-label="Mapa do Jardim Botânico"></div>

<header id="top">
  <button id="searchBtn" class="pill" type="button" aria-label="Buscar pontos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    <span>Buscar no Jardim</span>
    <em>63 pontos</em>
  </button>
  <div id="status" class="pill status" hidden></div>
</header>

<div id="ctrls">
  <button id="compassBtn" class="fab" type="button" aria-label="Apontar o mapa para o norte" hidden>
    <svg viewBox="0 0 40 40" aria-hidden="true"><path class="n" d="M20 5 25 20H15z"/><path class="s" d="M20 35 15 20h10z"/></svg>
  </button>
  <button id="layerBtn" class="fab" type="button" aria-label="Trocar entre mapa e satélite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
    <b id="layerLbl">Satélite</b>
  </button>
  <button id="locBtn" class="fab loc" type="button" aria-label="Mostrar minha localização">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6.5"/><circle class="dot" cx="12" cy="12" r="2.6"/></svg>
  </button>
</div>

<button id="startBtn" class="cta" type="button">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 19 21 12 17 5 21z"/></svg>
  Mostrar onde estou e para onde aponto
</button>

<section id="sheet" aria-live="polite" hidden>
  <div class="grab"></div>
  <div class="row">
    <div id="sBadge" class="badge">47</div>
    <div class="txt">
      <h2 id="sTitle"></h2>
      <p id="sEn"></p>
    </div>
    <button id="sClose" class="x" type="button" aria-label="Fechar">×</button>
  </div>
  <div class="row meta">
    <div id="sDir" class="dir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 20 12 16 5 20z"/></svg></div>
    <div id="sDist" class="dist">Ative a localização para ver a distância</div>
  </div>
  <div class="row acts">
    <button id="sRoute" class="btn primary" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 19h6a4 4 0 0 0 0-8h-2a4 4 0 0 1 0-8h6"/></svg>
      Como chegar a pé</button>
    <button id="sCenter" class="btn" type="button">Ver no mapa</button>
  </div>
  <p id="sSrc" class="src"></p>
</section>

<section id="routeBar" hidden>
  <div class="rb-main">
    <div class="rb-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6zM10 22l1.5-7 2.5 2.5V22M8 11l2-4 3 1 2 3.5 3 1"/></svg></div>
    <div class="rb-txt"><b id="rbMain">—</b><span id="rbSub">—</span></div>
    <button id="rbClose" class="x" type="button" aria-label="Encerrar rota">×</button>
  </div>
</section>

<section id="list" hidden>
  <div class="list-head">
    <input id="q" type="search" placeholder="Nome ou número (ex.: 47, orquídeas, banheiro)" autocomplete="off" enterkeyhint="search">
    <button id="listClose" class="x" type="button" aria-label="Fechar lista">×</button>
  </div>
  <div class="chips" id="chips">
    <button data-f="" class="on" type="button">Todos</button>
    <button data-f="perto" type="button">Mais perto</button>
    <button data-f="jardim" type="button">Jardins e estufas</button>
    <button data-f="agua" type="button">Lagos</button>
    <button data-f="arte" type="button">Estátuas</button>
    <button data-f="historia" type="button">História</button>
    <button data-f="servico" type="button">Serviços</button>
  </div>
  <ol id="items"></ol>
  <p class="foot">Os números são os mesmos das placas do Jardim. Desenho dos caminhos, lagos e prédios: OpenStreetMap. Satélite: Esri.</p>
</section>

<div id="toast" role="status" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="data.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
